name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/jig-review/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The type check reads Pi's own types, so CI installs the Pi version Jig is built against.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      # Tests that make commits need an author.
      - name: Set a git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Types and Biome
        run: npm run check

      - name: Tests
        run: npm test

      - name: Install the review page's dependencies
        run: npm ci
        working-directory: plugins/jig-review/web

      - name: Review page types
        run: npm run check:web

      - name: Review page tests
        run: npm run test:web

      - name: Review page build is current
        run: npm run check:dist

  # The plugins against real services (docs/integration-tests.md). The services start as containers, and each suite
  # finds its service by the address in an environment variable. JIG_IT_REQUIRE lists the services this job starts: a
  # suite whose service did not come up fails, and does not skip.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests resolve Pi's own packages from the installed Pi, as `checks` does.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      - name: Set a git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Integration tests
        if: ${{ !cancelled() }}
        env:
          JIG_IT_REQUIRE: ""
        run: npm run test:it
