name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: jig-sandbox's tests run the real sandbox, which depends on the kernel and AppArmor settings of the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/jig-review/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The type check reads Pi's own types, so CI installs the Pi version Jig is built against.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      # Tests that make commits need an author.
      - name: Set a git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      # jig-sandbox's escape and keep-working tests run the real sandbox, and fail (they are not skipped) when it cannot run.
      # Ubuntu 24.04 stops unprivileged programs from making a user namespace, which bubblewrap needs.
      - name: Install the programs the sandbox needs
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Types and Biome
        run: npm run check

      - name: Tests
        run: npm test

      - name: Install the review page's dependencies
        run: npm ci
        working-directory: plugins/jig-review/web

      - name: Review page types
        run: npm run check:web

      - name: Review page tests
        run: npm run test:web

      - name: Review page build is current
        run: npm run check:dist

  # The plugins against real services (docs/integration-tests.md). The services start as containers, and each suite
  # finds its service by the address in an environment variable. JIG_IT_REQUIRE lists the services this job starts: a
  # suite whose service did not come up fails, and does not skip. The passwords below are throwaway values for
  # containers that live as long as this job, and none is a secret.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read only: the workflow runs and their checks are read for the jig-ops tests, and the run's own token is the only credential.
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    env:
      # Every image has an exact version tag and its digest. To update one, change both together.
      ES_IMAGE: docker.elastic.co/elasticsearch/elasticsearch:8.19.23@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1
      OPENSEARCH_IMAGE: opensearchproject/opensearch:2.19.7@sha256:3bfa1ec74d56928c2e018033d45c460ce2c0ea65a5cedd577de3102326c31b89
      LOKI_IMAGE: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
      # MongoDB 7.0: the 8.x releases exit at start-up on the runner's Linux kernel (6.19 and later), and only 7.0 starts on every
      # kernel (https://jira.mongodb.org/browse/SERVER-125742 has the table of versions and kernels).
      MONGO_IMAGE: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
      HTTPBIN_IMAGE: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
      SSH_IMAGE: linuxserver/openssh-server:10.3_p1-r1-ls240@sha256:b07414bb329b86a00525c9256711a7855fc3a369e9f62c36f1de8d1923197580
      JIG_IT_ELASTICSEARCH_PASSWORD: throwaway-elastic-password
      JIG_IT_MONGO_PASSWORD: throwaway-mongo-password
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests resolve Pi's own packages from the installed Pi, as `checks` does.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      - name: Set a git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      # Elasticsearch with security on (HTTPS with a certificate authority of its own, and a password for `elastic`),
      # OpenSearch with its security plugin off, and two Loki nodes with tenants on: one with the defaults, and one with
      # tight limits, to show the errors Loki words for them. Loki is told to keep past samples where it can query them,
      # and not to report usage. The services are started together and waited for in the next step.
      - name: Start Elasticsearch, OpenSearch and Loki
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name jigit-elasticsearch -p 127.0.0.1:9200:9200 \
            -e discovery.type=single-node -e xpack.ml.enabled=false -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            -e ELASTIC_PASSWORD="$JIG_IT_ELASTICSEARCH_PASSWORD" "$ES_IMAGE"
          docker run -d --name jigit-opensearch -p 127.0.0.1:9201:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" "$OPENSEARCH_IMAGE"
          loki_flags="-config.file=/etc/loki/local-config.yaml -auth.enabled=true -reporting.enabled=false
            -ingester.query-store-max-look-back-period=168h -querier.query-ingesters-within=200h"
          docker run -d --name jigit-loki -p 127.0.0.1:3100:3100 "$LOKI_IMAGE" $loki_flags
          docker run -d --name jigit-loki-limited -p 127.0.0.1:3101:3100 "$LOKI_IMAGE" $loki_flags \
            -store.max-query-length=20m -validation.max-entries-limit=150

      - name: Wait for Elasticsearch, OpenSearch and Loki
        if: ${{ !cancelled() }}
        run: |
          retry="--retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors"
          # Elasticsearch makes its certificate authority when it starts: the tests trust this file.
          for _ in $(seq 1 90); do
            docker cp jigit-elasticsearch:/usr/share/elasticsearch/config/certs/http_ca.crt "$RUNNER_TEMP/es-ca.crt" 2>/dev/null && break
            sleep 2
          done
          curl -fsS $retry --cacert "$RUNNER_TEMP/es-ca.crt" -u "elastic:$JIG_IT_ELASTICSEARCH_PASSWORD" \
            "https://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=60s" > /dev/null
          curl -fsS $retry "http://127.0.0.1:9201/_cluster/health?wait_for_status=yellow&timeout=60s" > /dev/null
          curl -fsS $retry http://127.0.0.1:3100/ready
          curl -fsS $retry http://127.0.0.1:3101/ready
          echo "Elasticsearch $(curl -fsS --cacert "$RUNNER_TEMP/es-ca.crt" -u "elastic:$JIG_IT_ELASTICSEARCH_PASSWORD" https://127.0.0.1:9200 | jq -r .version.number)"
          echo "OpenSearch $(curl -fsS http://127.0.0.1:9201 | jq -r .version.number)"
          echo "Loki $(curl -fsS -H 'X-Scope-OrgID: jig-it' http://127.0.0.1:3100/loki/api/v1/status/buildinfo | jq -r .version)"

      # A three-member replica set with authentication, and an SSH server on the same Docker network. The members are named
      # mongo1, mongo2 and mongo3, and only containers on that network can look those names up: the test runs on the host, so the
      # SSH route and the SOCKS tunnel are the only way to them. mongo1 is also published on 127.0.0.1:27017 for the direct test.
      # The image makes the root user and then starts mongod with the key file, which it copies where mongod may read it.
      - name: Start MongoDB and the jump host
        if: ${{ !cancelled() }}
        run: |
          openssl rand -base64 756 > "$RUNNER_TEMP/mongo-keyfile"
          ssh-keygen -q -t ed25519 -N "" -C jig-it -f "$RUNNER_TEMP/jump_key"
          mkdir -p "$RUNNER_TEMP/sshd_config.d"
          echo "AllowTcpForwarding yes" > "$RUNNER_TEMP/sshd_config.d/forwarding.conf"
          docker network create jigit
          for n in 1 2 3; do
            publish=""
            if [ "$n" = 1 ]; then publish="-p 127.0.0.1:27017:27017"; fi
            docker run -d --name "mongo$n" --network jigit $publish \
              -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD="$JIG_IT_MONGO_PASSWORD" \
              -v "$RUNNER_TEMP/mongo-keyfile:/keyfile.src:ro" --entrypoint bash "$MONGO_IMAGE" \
              -c 'install -m 400 -o mongodb -g mongodb /keyfile.src /data/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile'
          done
          docker run -d --name jump --network jigit -p 127.0.0.1:2222:2222 \
            -e USER_NAME=jigit -e PUBLIC_KEY="$(cat "$RUNNER_TEMP/jump_key.pub")" \
            -v "$RUNNER_TEMP/sshd_config.d:/config/sshd/sshd_config.d" "$SSH_IMAGE"

      - name: Set up the replica set and wait for the jump host
        if: ${{ !cancelled() }}
        run: |
          # Waits until a command succeeds. A container that has stopped ends the wait at once, with its log, so a member that
          # cannot start fails this step in seconds and not after all the time it would have waited.
          wait_until() {
            local what=$1
            shift
            for _ in $(seq 1 90); do
              if "$@" > /dev/null 2>&1; then return 0; fi
              for name in mongo1 mongo2 mongo3 jump; do
                if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
                  echo "::error::$name stopped while waiting for $what"
                  docker logs --tail 60 "$name" 2>&1
                  return 1
                fi
              done
              sleep 2
            done
            echo "::error::gave up waiting for $what"
            return 1
          }
          mongo() { docker exec "$1" mongosh --quiet -u root -p "$JIG_IT_MONGO_PASSWORD" --authenticationDatabase admin --eval "$2"; }
          # The image first starts a mongod of its own to make the root user. Only after it says so is the real one coming up.
          initialised() { docker logs "$1" 2>&1 | grep -q "MongoDB init process complete"; }
          answers() { mongo "$1" 'db.hello().ok'; }
          is_primary() { [ "$(mongo mongo1 'db.hello().isWritablePrimary')" = true ]; }
          reads() {
            docker exec "$1" mongosh --quiet -u agent-readonly -p "$JIG_IT_MONGO_PASSWORD" --authenticationDatabase admin \
              --eval 'db.hello().ok'
          }
          host_key() { [ -n "$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null)" ]; }
          for n in 1 2 3; do
            wait_until "mongo$n to finish its set-up" initialised "mongo$n"
            wait_until "mongo$n to answer" answers "mongo$n"
          done
          mongo mongo1 'rs.initiate({_id: "rs0", members: [
            {_id: 0, host: "mongo1:27017", priority: 10}, {_id: 1, host: "mongo2:27017"}, {_id: 2, host: "mongo3:27017"}]}).ok'
          wait_until "mongo1 to be the primary" is_primary
          mongo mongo1 "
            const admin = db.getSiblingDB('admin');
            const options = {w: 'majority'};
            admin.createUser({user: 'agent', pwd: '$JIG_IT_MONGO_PASSWORD',
              roles: ['readWriteAnyDatabase', 'dbAdminAnyDatabase', 'clusterMonitor']}, options);
            admin.createUser({user: 'agent-readonly', pwd: '$JIG_IT_MONGO_PASSWORD', roles: ['readAnyDatabase']}, options);"
          # The users are on every member, so a read from a secondary can sign in.
          for n in 1 2 3; do wait_until "the users to reach mongo$n" reads "mongo$n"; done
          mongo mongo1 'rs.status().members.map((m) => m.name + " " + m.stateStr).join(", ")'
          mongo mongo1 'db.version()'
          wait_until "the jump host to answer" host_key
          ssh-keyscan -v -p 2222 127.0.0.1 2>&1 | grep -i "remote software version" | head -1
          ssh -V

      # go-httpbin answers every request with what it received, and takes bodies up to 8 MiB. Keycloak runs in dev mode and imports
      # the realm of the jig-api tests, whose client secret and user password are throwaway values in that file.
      - name: Start go-httpbin and Keycloak
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name jigit-httpbin -p 127.0.0.1:8081:8080 -e MAX_BODY_SIZE=8388608 "$HTTPBIN_IMAGE"
          docker run -d --name jigit-keycloak -p 127.0.0.1:8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=throwaway-keycloak-admin \
            -v "$GITHUB_WORKSPACE/plugins/jig-api/test/it/keycloak:/opt/keycloak/data/import:ro" \
            "$KEYCLOAK_IMAGE" start-dev --import-realm
          retry="--retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors"
          curl -fsS $retry http://127.0.0.1:8081/status/200 > /dev/null
          echo "go-httpbin ${HTTPBIN_IMAGE%%@*}"
          curl -fsS $retry http://127.0.0.1:8180/realms/jigit/.well-known/openid-configuration > /dev/null
          docker logs jigit-keycloak 2>&1 | grep -m1 "Keycloak .* on JVM" || true

      # A Kubernetes cluster in Docker, and Helm. The actions download kind and kubectl at the versions given here.
      - name: Set up Helm
        if: ${{ !cancelled() }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Create a kind cluster
        if: ${{ !cancelled() }}
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.36.4
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: jigit
          wait: 120s

      - name: Show the cluster
        if: ${{ !cancelled() }}
        run: |
          kubectl --context kind-jigit get nodes -o wide
          helm version --short

      - name: Integration tests
        if: ${{ !cancelled() }}
        env:
          JIG_IT_REQUIRE: elasticsearch,opensearch,loki,mongodb,mongodb-ssh,mongodb-socks,kubernetes,github-actions,github,github-gh,httpbin,keycloak
          JIG_IT_ELASTICSEARCH_URL: https://127.0.0.1:9200
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/es-ca.crt
          JIG_IT_OPENSEARCH_URL: http://127.0.0.1:9201
          JIG_IT_LOKI_URL: http://127.0.0.1:3100
          JIG_IT_LOKI_LIMITED_URL: http://127.0.0.1:3101
          JIG_IT_MONGO_DIRECT_URI: mongodb://127.0.0.1:27017/?directConnection=true
          JIG_IT_MONGO_REPLICA_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
          JIG_IT_MONGO_SSH_URI: mongodb://mongo1:27017
          JIG_IT_MONGO_MEMBERS_HIDDEN: "1"
          JIG_IT_MONGO_USER: agent
          JIG_IT_MONGO_READONLY_USER: agent-readonly
          JIG_IT_SSH_HOST: 127.0.0.1
          JIG_IT_SSH_PORT: "2222"
          JIG_IT_SSH_USER: jigit
          JIG_IT_SSH_KEY_FILE: ${{ runner.temp }}/jump_key
          JIG_IT_KUBE_CONTEXT: kind-jigit
          # The token Actions gives this run, which `gh` reads from GH_TOKEN. The permissions above make it read only.
          GH_TOKEN: ${{ github.token }}
          JIG_IT_GITHUB_REPOSITORY: ${{ github.repository }}
          JIG_IT_GITHUB_RUN_ID: ${{ github.run_id }}
          JIG_IT_GITHUB: "1"
          JIG_IT_HTTPBIN_URL: http://127.0.0.1:8081
          JIG_IT_KEYCLOAK_URL: http://127.0.0.1:8180
        run: npm run test:it

      # The logs of every container, so a service that failed can be read in the run.
      - name: Service logs
        if: ${{ failure() }}
        run: |
          docker ps -a
          if command -v kubectl > /dev/null; then
            echo "::group::kubectl get pods and events"
            kubectl --context kind-jigit get pods --all-namespaces -o wide || true
            kubectl --context kind-jigit get events --all-namespaces --sort-by=.lastTimestamp | tail -60 || true
            echo "::endgroup::"
          fi
          for name in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::docker logs $name"
            docker logs --tail 300 "$name" 2>&1 || true
            echo "::endgroup::"
          done
