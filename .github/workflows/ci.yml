name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: jig-sandbox's tests run the real sandbox, which depends on the kernel and AppArmor settings of the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/jig-review/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The type check reads Pi's own types, so CI installs the Pi version Jig is built against.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      # Tests that make commits need an author.
      - name: Set a git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      # jig-sandbox's escape and keep-working tests run the real sandbox, and fail (they are not skipped) when it cannot run.
      # Ubuntu 24.04 stops unprivileged programs from making a user namespace, which bubblewrap needs.
      - name: Install the programs the sandbox needs
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Types and Biome
        run: npm run check

      - name: Tests
        run: npm test

      - name: Install the review page's dependencies
        run: npm ci
        working-directory: plugins/jig-review/web

      - name: Review page types
        run: npm run check:web

      - name: Review page tests
        run: npm run test:web

      - name: Review page build is current
        run: npm run check:dist
