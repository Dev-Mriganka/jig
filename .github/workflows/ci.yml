name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    # Pinned: jig-sandbox's tests run the real sandbox, which depends on the kernel and AppArmor settings of the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Both runs finish, so a failure that is only on one Node line is seen next to the pass on the other.
      fail-fast: false
      matrix:
        # The current LTS line (26, since 2026-10-28) and the previous one (24). package.json says >=22.19.0.
        node: [26, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/jig-review/web/package-lock.json

      - name: Show the versions
        run: |
          node --version
          npm --version

      # No dependency of Jig has an install script (npm query ':attr(scripts, [install]), :attr(scripts, [postinstall])' is empty), so
      # none runs: a package that gains one cannot run code on the runner unseen. The same for the review page's dependencies below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The type check reads Pi's own types, so CI installs the Pi version Jig is built against: exactly this one, which is
      # the latest. When Pi has a new release, change it here and in AGENTS.md together, after the checks pass on it.
      - name: Install Pi
        run: |
          npm install -g @earendil-works/pi-coding-agent@1.4.0
          npm ls -g --depth=0 @earendil-works/pi-coding-agent

      # jig-sandbox's escape and keep-working tests run the real sandbox, and fail (they are not skipped) when it cannot run.
      # Ubuntu 24.04 stops unprivileged programs from making a user namespace, which bubblewrap needs.
      - name: Install the programs the sandbox needs
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Types and Biome
        run: npm run check

      - name: Tests
        run: npm test

      # Jig as a user gets it: `pi install git:` on a copy of the repository (only `dependencies` installed), then the stock Pi
      # starts with that copy as its only package and every extension in package.json must have loaded (scripts/check-install.mjs).
      - name: Install check
        run: npm run check:install

      - name: Install the review page's dependencies
        run: npm ci --ignore-scripts
        working-directory: plugins/jig-review/web

      - name: Review page types
        run: npm run check:web

      - name: Review page tests
        run: npm run test:web

      - name: Review page build is current
        run: npm run check:dist

  # The plugins against real services (docs/integration-tests.md). The services start as containers from
  # .github/integration/compose.yml, and each suite finds its service by the address in an environment variable.
  # JIG_IT_REQUIRE lists the services this job starts: a suite whose service did not come up fails, and does not skip.
  # The passwords below are throwaway values for containers that live as long as this job, and none is a secret.
  #
  # Two runs, the latest line and the previous one. The previous line moves Node back one LTS, the services to the
  # previous major (Elasticsearch 8, OpenSearch 2, MongoDB 8.0, from previous/compose.yml) and Helm to 3, so the
  # versions that users run side by side are all tried, without a run for every combination.
  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest services, Node 26, Helm 4
            node: 26
            helm: v4.3.1
            compose_files: .github/integration/compose.yml
          - name: previous services, Node 24, Helm 3
            node: 24
            helm: v3.22.1
            compose_files: .github/integration/compose.yml:.github/integration/previous/compose.yml
    # Read only: the workflow runs and their checks are read for the jig-ops tests, and the run's own token is the only credential.
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    env:
      COMPOSE_FILE: ${{ matrix.compose_files }}
      JIG_IT_ELASTICSEARCH_PASSWORD: throwaway-elastic-password
      JIG_IT_MONGO_PASSWORD: throwaway-mongo-password
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The tests resolve Pi's own packages from the installed Pi, as `checks` does. Exactly this version, the latest.
      - name: Install Pi
        run: |
          npm install -g @earendil-works/pi-coding-agent@1.4.0
          npm ls -g --depth=0 @earendil-works/pi-coding-agent

      # The key file of the replica set, the jump host's SSH key and its settings go to a folder of this run. The script prints
      # JIG_IT_TEMP and JIG_IT_SSH_PUBLIC_KEY, which compose.yml reads, and the next steps get them from $GITHUB_ENV.
      - name: Prepare the services' files
        run: .github/integration/prepare.sh "$RUNNER_TEMP/jigit" >> "$GITHUB_ENV"

      # The versions of the tools, and the images this run will start, each pinned by tag and digest.
      - name: Show the versions
        run: |
          node --version
          npm --version
          docker --version
          docker compose version
          echo "Compose files: $COMPOSE_FILE"
          docker compose config --images | sort
          echo "Kubernetes node image: $(docker compose --profile tools config --format json | jq -r '.services["kind-node"].image')"

      - name: Pull the images
        run: docker compose pull --quiet

      # Elasticsearch with security on (HTTPS with a certificate authority of its own, and a password for `elastic`),
      # OpenSearch with its security plugin off, and two Loki nodes with tenants on: one with the defaults, and one with
      # tight limits, to show the errors Loki words for them. The services are started together and waited for in the next step.
      - name: Start Elasticsearch, OpenSearch and Loki
        if: ${{ !cancelled() }}
        run: docker compose up -d elasticsearch opensearch loki loki-limited

      - name: Wait for Elasticsearch, OpenSearch and Loki
        if: ${{ !cancelled() }}
        run: |
          retry="--retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors"
          ca="$JIG_IT_TEMP/es-ca.crt"
          # Elasticsearch makes its certificate authority when it starts: the tests trust this file.
          for _ in $(seq 1 90); do
            docker cp jigit-elasticsearch:/usr/share/elasticsearch/config/certs/http_ca.crt "$ca" 2>/dev/null && break
            sleep 2
          done
          curl -fsS $retry --cacert "$ca" -u "elastic:$JIG_IT_ELASTICSEARCH_PASSWORD" \
            "https://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=60s" > /dev/null
          curl -fsS $retry "http://127.0.0.1:9201/_cluster/health?wait_for_status=yellow&timeout=60s" > /dev/null
          curl -fsS $retry http://127.0.0.1:3100/ready
          curl -fsS $retry http://127.0.0.1:3101/ready
          echo "Elasticsearch $(curl -fsS --cacert "$ca" -u "elastic:$JIG_IT_ELASTICSEARCH_PASSWORD" https://127.0.0.1:9200 | jq -r .version.number)"
          echo "OpenSearch $(curl -fsS http://127.0.0.1:9201 | jq -r .version.number)"
          echo "Loki $(curl -fsS -H 'X-Scope-OrgID: jig-it' http://127.0.0.1:3100/loki/api/v1/status/buildinfo | jq -r .version)"

      # A three-member replica set with authentication, and an SSH server on the same Docker network. The members are named
      # mongo1, mongo2 and mongo3, and only containers on that network can look those names up: the test runs on the host, so the
      # SSH route and the SOCKS tunnel are the only way to them. mongo1 is also published on 127.0.0.1:27017 for the direct test.
      # Each member runs with GLIBC_TUNABLES=glibc.pthread.rseq=1 (see compose.yml); the next step asserts that it took effect.
      - name: Start MongoDB and the jump host
        if: ${{ !cancelled() }}
        run: docker compose up -d mongo1 mongo2 mongo3 jump

      - name: Set up the replica set and wait for the jump host
        if: ${{ !cancelled() }}
        run: |
          # Waits until a command succeeds. A container that has stopped ends the wait at once, with its log, so a member that
          # cannot start fails this step in seconds and not after all the time it would have waited.
          wait_until() {
            local what=$1
            shift
            for _ in $(seq 1 90); do
              if "$@" > /dev/null 2>&1; then return 0; fi
              for name in mongo1 mongo2 mongo3 jump; do
                if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
                  echo "::error::$name stopped while waiting for $what"
                  docker logs --tail 60 "$name" 2>&1
                  return 1
                fi
              done
              sleep 2
            done
            echo "::error::gave up waiting for $what"
            return 1
          }
          mongo() { docker exec "$1" mongosh --quiet -u root -p "$JIG_IT_MONGO_PASSWORD" --authenticationDatabase admin --eval "$2"; }
          # The image first starts a mongod of its own to make the root user. Only after it says so is the real one coming up.
          initialised() { docker logs "$1" 2>&1 | grep -q "MongoDB init process complete"; }
          answers() { mongo "$1" 'db.hello().ok'; }
          is_primary() { [ "$(mongo mongo1 'db.hello().isWritablePrimary')" = true ]; }
          reads() {
            docker exec "$1" mongosh --quiet -u agent-readonly -p "$JIG_IT_MONGO_PASSWORD" --authenticationDatabase admin \
              --eval 'db.hello().ok'
          }
          host_key() { [ -n "$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null)" ]; }
          for n in 1 2 3; do
            wait_until "mongo$n to finish its set-up" initialised "mongo$n"
            wait_until "mongo$n to answer" answers "mongo$n"
          done
          # GLIBC_TUNABLES=glibc.pthread.rseq=1 makes TCMalloc use per-thread caches. If a member reports anything but false, the
          # setting did not take effect (an image that ignores it, or a changed variable), and mongod would stop on a kernel
          # that the check refuses, so fail here and say why.
          for n in 1 2 3; do
            per_cpu=$(mongo "mongo$n" 'db.serverStatus().tcmalloc.usingPerCPUCaches')
            echo "mongo$n: tcmalloc.usingPerCPUCaches = $per_cpu"
            if [ "$per_cpu" != false ]; then
              echo "::error::mongo$n runs TCMalloc with per-CPU caches (got '$per_cpu'): GLIBC_TUNABLES=glibc.pthread.rseq=1 did not take effect"
              docker exec "mongo$n" printenv GLIBC_TUNABLES || true
              mongo "mongo$n" 'JSON.stringify(db.serverStatus().tcmalloc)' | head -c 1500
              exit 1
            fi
          done
          mongo mongo1 'rs.initiate({_id: "rs0", members: [
            {_id: 0, host: "mongo1:27017", priority: 10}, {_id: 1, host: "mongo2:27017"}, {_id: 2, host: "mongo3:27017"}]}).ok'
          wait_until "mongo1 to be the primary" is_primary
          mongo mongo1 "
            const admin = db.getSiblingDB('admin');
            const options = {w: 'majority'};
            admin.createUser({user: 'agent', pwd: '$JIG_IT_MONGO_PASSWORD',
              roles: ['readWriteAnyDatabase', 'dbAdminAnyDatabase', 'clusterMonitor']}, options);
            admin.createUser({user: 'agent-readonly', pwd: '$JIG_IT_MONGO_PASSWORD', roles: ['readAnyDatabase']}, options);"
          # The users are on every member, so a read from a secondary can sign in.
          for n in 1 2 3; do wait_until "the users to reach mongo$n" reads "mongo$n"; done
          mongo mongo1 'rs.status().members.map((m) => m.name + " " + m.stateStr).join(", ")'
          echo "MongoDB $(mongo mongo1 'db.version()')"
          wait_until "the jump host to answer" host_key
          # What sshd settled on, so that a drop-in that was not read shows here and not as a failure of the tests.
          docker exec jump /usr/sbin/sshd.pam -T -f /config/sshd/sshd_config -h /config/ssh_host_keys/ssh_host_ed25519_key 2>&1 \
            | grep -i -E "^(persourcepenalties|allowtcpforwarding|loglevel) " || true
          ssh-keyscan -v -p 2222 127.0.0.1 2>&1 | grep -i "remote software version" | head -1
          ssh -V

      # go-httpbin answers every request with what it received, and takes bodies up to 8 MiB. Keycloak runs in dev mode and imports
      # the realm of the jig-api tests, whose client secret and user password are throwaway values in that file.
      - name: Start go-httpbin and Keycloak
        if: ${{ !cancelled() }}
        run: |
          docker compose up -d httpbin keycloak
          retry="--retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors"
          curl -fsS $retry http://127.0.0.1:8081/status/200 > /dev/null
          echo "go-httpbin $(docker inspect -f '{{.Config.Image}}' jigit-httpbin)"
          curl -fsS $retry http://127.0.0.1:8180/realms/jigit/.well-known/openid-configuration > /dev/null
          docker logs jigit-keycloak 2>&1 | grep -m1 "Keycloak .* on JVM" || true

      # Compose holds the Kubernetes node image (a service that is never started), so that Dependabot can track it.
      - name: Read the Kubernetes node image
        id: images
        if: ${{ !cancelled() }}
        run: echo "kind_node=$(docker compose --profile tools config --format json | jq -r '.services["kind-node"].image')" >> "$GITHUB_OUTPUT"

      # A Kubernetes cluster in Docker, and Helm. The actions download kind, kubectl and Helm at the versions given here.
      - name: Set up Helm
        if: ${{ !cancelled() }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Create a kind cluster
        if: ${{ !cancelled() }}
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.2
          node_image: ${{ steps.images.outputs.kind_node }}
          cluster_name: jigit
          wait: 120s

      - name: Show the cluster
        if: ${{ !cancelled() }}
        run: |
          kubectl --context kind-jigit get nodes -o wide
          kubectl --context kind-jigit version
          kind version
          helm version --short

      - name: Integration tests
        if: ${{ !cancelled() }}
        env:
          JIG_IT_REQUIRE: elasticsearch,opensearch,loki,mongodb,mongodb-ssh,mongodb-socks,kubernetes,github-actions,github,github-gh,httpbin,keycloak
          JIG_IT_ELASTICSEARCH_URL: https://127.0.0.1:9200
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/jigit/es-ca.crt
          JIG_IT_OPENSEARCH_URL: http://127.0.0.1:9201
          JIG_IT_LOKI_URL: http://127.0.0.1:3100
          JIG_IT_LOKI_LIMITED_URL: http://127.0.0.1:3101
          JIG_IT_MONGO_DIRECT_URI: mongodb://127.0.0.1:27017/?directConnection=true
          JIG_IT_MONGO_REPLICA_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
          JIG_IT_MONGO_SSH_URI: mongodb://mongo1:27017
          JIG_IT_MONGO_MEMBERS_HIDDEN: "1"
          JIG_IT_MONGO_USER: agent
          JIG_IT_MONGO_READONLY_USER: agent-readonly
          JIG_IT_SSH_HOST: 127.0.0.1
          JIG_IT_SSH_PORT: "2222"
          JIG_IT_SSH_USER: jigit
          JIG_IT_SSH_KEY_FILE: ${{ runner.temp }}/jigit/jump_key
          JIG_IT_KUBE_CONTEXT: kind-jigit
          # The token Actions gives this run, which `gh` reads from GH_TOKEN. The permissions above make it read only.
          GH_TOKEN: ${{ github.token }}
          JIG_IT_GITHUB_REPOSITORY: ${{ github.repository }}
          JIG_IT_GITHUB_RUN_ID: ${{ github.run_id }}
          JIG_IT_GITHUB: "1"
          JIG_IT_HTTPBIN_URL: http://127.0.0.1:8081
          JIG_IT_KEYCLOAK_URL: http://127.0.0.1:8180
        run: npm run test:it

      # The logs of every container, so a service that failed can be read in the run.
      - name: Service logs
        if: ${{ failure() }}
        run: |
          docker ps -a
          if command -v kubectl > /dev/null; then
            echo "::group::kubectl get pods and events"
            kubectl --context kind-jigit get pods --all-namespaces -o wide || true
            kubectl --context kind-jigit get events --all-namespaces --sort-by=.lastTimestamp | tail -60 || true
            echo "::endgroup::"
          fi
          for name in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::docker logs $name"
            docker logs --tail 300 "$name" 2>&1 || true
            echo "::endgroup::"
          done
