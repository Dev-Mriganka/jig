# Read before the rest of the image's sshd configuration, and the first value of a setting wins.
AllowTcpForwarding yes
# OpenSSH 9.8 and later drop every connection from an address that has failed to sign in a few times in a few seconds. The tests
# fail to sign in on purpose (a key the server does not know, a user it does not have) from the one address they all come from,
# so the tests that follow would find the door shut.
PerSourcePenalties no
MaxStartups 100:30:200
LogLevel VERBOSE
