  <rect x="450" y="144" width="300" height="36" fill="#1D3B4D"/>
  <text x="600" y="167" font-size="13" fill="#FFFFFF" text-anchor="middle">config.addSectionDefaults</text>
  <path d="M752 162 H856" fill="none" stroke="#5D4B7C" stroke-width="3" marker-end="url(#acme-seams-head-5d4b7c)"/>
