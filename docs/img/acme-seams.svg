  <rect x="450" y="96" width="300" height="36" fill="#1D3B4D"/>
  <text x="600" y="119" font-size="13" fill="#FFFFFF" text-anchor="middle">config.addEnvironments</text>
  <path d="M752 114 H856" fill="none" stroke="#5D4B7C" stroke-width="3" marker-end="url(#acme-seams-head-5d4b7c)"/>
