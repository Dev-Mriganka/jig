  <defs>
    <marker id="acme-seams-head-5d4b7c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D4B7C"/></marker>
  </defs>
  <!-- column heads -->
  <text x="40" y="50" font-size="16" fill="#4E7A58" font-weight="700">jig-acme: one file per seam</text>
  <text x="450" y="50" font-size="16" fill="#4E7A58" font-weight="700">what it calls on jig-core</text>
  <text x="860" y="50" font-size="16" fill="#4E7A58" font-weight="700">what in Jig uses it</text>
  <text x="40" y="72" font-size="13" fill="#5A645F">a Pi package that loads after jig-core, and uses only its public contract</text>
