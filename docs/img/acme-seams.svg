<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="646" viewBox="0 0 1200 646" role="img" aria-label="The files of the example company plugin jig-acme, each handed to one call of jig-core's global handle, and what in Jig reads it: environments, section defaults for nine plugins, a secret command, a sign-in service, a transport, a tunnel, masked field names, a protected path, a status line, and an overlay skill that Pi loads from the package manifest." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
