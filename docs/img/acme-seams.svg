  <text x="190" y="407" font-size="13" fill="#FFFFFF" text-anchor="middle">masking.ts</text>
  <path d="M342 402 H446" fill="none" stroke="#5D4B7C" stroke-width="3" marker-end="url(#acme-seams-head-5d4b7c)"/>
