<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="756" viewBox="0 0 1140 756" role="img" aria-label="A ticket over time. Feedforward guides on the left go into Pi before it writes code. Feedback comes back on the right at four points: the edit loop with its checks; the checker loop; your one approval; and after the pull request, where CI, reviews, teammates and the QA environment report back as new commits through the review ledger." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
