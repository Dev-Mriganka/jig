<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-label="How a jig-git call runs. The agent calls git, pr or release. jig-core classifies the action: reads and local writes run, writes to GitHub ask you. Local git actions run through exec.git, with no shell and hooks off, and refuse a repository whose own configuration runs a command. GitHub actions run through gh, and a lost reply is read once and never sent again. Guarded steps: git push asks and lists the commits, pull request writes ask on a review screen, a protected branch refuses a direct push, force push, rebase, cherry-pick, create or delete, and a merge is refused if the head changed since the preview. After a push and after a pull request is created, jig-git publishes jig-git:pushed on Pi&#x27;s event bus, and jig-ops starts a CI watch." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="499" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="gitflow-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="gitflow-head-5c9cab-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C9CAB"/></marker>
  </defs>
  <!-- the call, and jig-core -->
  <rect x="30" y="50" width="170" height="64" rx="6" fill="#5D4B7C"/>
  <text x="115.0" y="78.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the agent</text>
  <text x="115.0" y="95.0" font-size="12" fill="#FFFFFF" text-anchor="middle">git, pr or release</text>
  <path d="M200 82 H270" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#gitflow-head-1d3b4d-11)"/>
  <text x="235" y="72" font-size="12" fill="#3A4440" text-anchor="middle">a call</text>
  <rect x="270" y="34" width="220" height="96" rx="6" fill="#1D3B4D"/>
  <text x="380.0" y="61.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-core</text>
  <text x="380.0" y="78.0" font-size="12" fill="#FFFFFF" text-anchor="middle">classifies each action:</text>
  <text x="380.0" y="95.0" font-size="12" fill="#FFFFFF" text-anchor="middle">reads and local writes run,</text>
  <text x="380.0" y="112.0" font-size="12" fill="#FFFFFF" text-anchor="middle">writes to GitHub ask you</text>
  <!-- what runs -->
  <rect x="560" y="34" width="390" height="64" rx="6" fill="#5C9CAB"/>
  <text x="755.0" y="53.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">local git</text>
  <text x="755.0" y="70.5" font-size="12" fill="#FFFFFF" text-anchor="middle">exec.git: no shell, hooks and prompts off</text>
  <text x="755.0" y="87.5" font-size="12" fill="#FFFFFF" text-anchor="middle">refuses a repository whose config runs a command</text>
  <rect x="560" y="112" width="390" height="64" rx="6" fill="#5C9CAB"/>
  <text x="755.0" y="131.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">GitHub, through gh</text>
  <text x="755.0" y="148.5" font-size="12" fill="#FFFFFF" text-anchor="middle">pull requests, reviews, tags and releases</text>
  <text x="755.0" y="165.5" font-size="12" fill="#FFFFFF" text-anchor="middle">a lost reply is read once, never sent again</text>
  <path d="M490 66 H560" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#gitflow-head-1d3b4d-11)"/>
  <text x="525" y="58" font-size="12" fill="#3A4440" text-anchor="middle">git</text>
  <path d="M490 100 H525 V144 H560" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#gitflow-head-1d3b4d-11)"/>
  <text x="525" y="166" font-size="12" fill="#3A4440" text-anchor="middle">pr, release</text>
  <!-- guarded steps -->
  <rect x="30" y="204" width="920" height="186" rx="6" fill="#E8ECEE"/>
  <text x="46" y="226" font-size="13" fill="#1A1F1D" font-weight="700">Guarded steps, decided before anything runs</text>
  <path d="M380 130 V204" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#gitflow-head-1d3b4d-11)"/>
  <text x="364" y="168" font-size="12" fill="#3A4440" text-anchor="end">your rules decide</text>
  <rect x="45" y="244" width="210" height="110" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="150.0" y="278.0" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">git push</text>
  <text x="150.0" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">asks you first</text>
  <text x="150.0" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">the preview lists the commits</text>
  <text x="150.0" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">a force only with lease</text>
  <rect x="275" y="244" width="210" height="110" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="380.0" y="278.0" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">pr writes</text>
  <text x="380.0" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">ask on a review screen</text>
  <text x="380.0" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">a merge needs the head to be</text>
  <text x="380.0" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">the commit you saw</text>
  <rect x="505" y="244" width="210" height="110" rx="6" fill="#F7E4DF" stroke="#A93C27" stroke-width="1.8"/>
  <text x="610.0" y="278.0" font-size="13" fill="#A93C27" font-weight="700" text-anchor="middle">protected branch</text>
  <text x="610.0" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">no direct push, force push,</text>
  <text x="610.0" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">rebase, cherry-pick, create</text>
  <text x="610.0" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">or delete by these tools</text>
  <rect x="735" y="244" width="210" height="110" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="840.0" y="278.0" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">reads and local writes</text>
  <text x="840.0" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">run at once: status, diff,</text>
  <text x="840.0" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">log, commit, branch, stash,</text>
  <text x="840.0" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">merge</text>
  <!-- the push is announced -->
  <path d="M150 354 V424" fill="none" stroke="#5C9CAB" stroke-width="2.4" marker-end="url(#gitflow-head-5c9cab-11)"/>
  <text x="166" y="412" font-size="12" fill="#3A4440">after it lands</text>
  <rect x="45" y="424" width="330" height="56" rx="6" fill="#5C9CAB"/>
  <text x="210.0" y="448.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-git:pushed</text>
  <text x="210.0" y="465.0" font-size="12" fill="#FFFFFF" text-anchor="middle">{ repo, branch, sha, pr? } after a push and a new pr</text>
  <path d="M375 452 H480" fill="none" stroke="#5C9CAB" stroke-width="2.4" marker-end="url(#gitflow-head-5c9cab-11)"/>
  <text x="427" y="442" font-size="12" fill="#3A4440" text-anchor="middle">Pi's event bus</text>
  <rect x="480" y="424" width="330" height="56" rx="6" fill="#5C9CAB"/>
  <text x="645.0" y="448.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-ops</text>
  <text x="645.0" y="465.0" font-size="12" fill="#FFFFFF" text-anchor="middle">starts a CI watch for a service that has the repo</text>
</svg>
