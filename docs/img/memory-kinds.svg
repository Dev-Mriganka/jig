<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-label="Three kinds of memory. Pi writes ticket memory while it works: notes, plan and evidence in one folder per ticket. Later, a memory keeper writes a card when a ticket closes and proposes organizational and personal facts, which are kept only after you approve them. At the start of a new ticket, recall matches it against past cards and hands Pi the related history as a short message." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="1239" height="649" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="memkinds-head-5d4b7c-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D4B7C"/></marker>
    <marker id="memkinds-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="memkinds-head-c08326-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C08326"/></marker>
  </defs>
  <!-- Pi works on a ticket -->
  <rect x="30" y="80" width="200" height="520" fill="#5D4B7C"/>
  <text x="130" y="134" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pi</text>
  <text x="130" y="160" font-size="15" fill="#FFFFFF" text-anchor="middle">on a ticket</text>
  <path d="M150.78 332 A24 24 0 1 1 116.23 324.34" fill="none" stroke="#E7B55B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="126.88,316.88 120.86,332.7 109.97,317.13" fill="#E7B55B"/>
  <path d="M230 96 H310 V56 H1000 V78" fill="none" stroke="#5D4B7C" stroke-width="3" marker-end="url(#memkinds-head-5d4b7c-11)"/>
  <text x="655" y="46" font-size="13.5" fill="#3A4440" text-anchor="middle">writes while it works: notes, plan, evidence</text>
  <!-- recall at ticket start (later) -->
  <rect x="360" y="80" width="330" height="250" fill="#1D3B4D"/>
  <text x="525" y="108" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Recall at ticket start</text>
  <polygon points="392,124 670,124 670,152 392,152 380,138" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="142.38" font-size="12.5" fill="#3B7C8A" text-anchor="middle">same ticket links</text>
  <polygon points="392,160 670,160 670,188 392,188 380,174" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="178.38" font-size="12.5" fill="#3B7C8A" text-anchor="middle">same classes</text>
  <polygon points="392,196 670,196 670,224 392,224 380,210" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="214.38" font-size="12.5" fill="#3B7C8A" text-anchor="middle">same identifiers</text>
  <polygon points="392,232 670,232 670,260 392,260 380,246" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="250.38" font-size="12.5" fill="#3B7C8A" text-anchor="middle">same error text</text>
  <polygon points="392,268 670,268 670,296 392,296 380,282" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="286.38" font-size="12.5" fill="#3B7C8A" text-anchor="middle">keyword search on the cards</text>
  <text x="525" y="318" font-size="12.5" fill="#FFFFFF" text-anchor="middle">the best cards arrive as a short message</text>
  <polygon points="360,180 270,180 236,212 270,244 360,244" fill="#1D3B4D"/>
  <text x="310" y="208" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">related</text>
  <text x="310" y="228" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">history</text>
  <!-- ticket memory: today a folder, later also a card -->
  <rect x="780" y="80" width="430" height="270" fill="#E8ECEE"/>
  <text x="995" y="108" font-size="20" fill="#1A1F1D" font-weight="700" text-anchor="middle">Ticket memory</text>
  <text x="995" y="128" font-size="12.5" fill="#3A4440" text-anchor="middle">one folder per ticket, kept after it closes</text>
  <rect x="840" y="146" width="350" height="120" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.5"/>
  <text x="852" y="166" font-size="12.5" fill="#1A1F1D" font-weight="700">PROJ-1021 · export job fails</text>
  <rect x="822" y="174" width="350" height="120" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.5"/>
  <text x="834" y="194" font-size="12.5" fill="#1A1F1D" font-weight="700">PROJ-1087 · two repositories</text>
  <rect x="804" y="202" width="350" height="138" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.5"/>
  <text x="816" y="224" font-size="13.5" fill="#1A1F1D" font-weight="700">PROJ-1102 · slow search</text>
  <text x="816" y="246" font-size="12.5" fill="#3A4440">folder: notes.md, plan.md,</text>
  <text x="816" y="264" font-size="12.5" fill="#3A4440">evidence/, ticket.json</text>
  <rect x="816" y="276" width="326" height="54" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="826" y="296" font-size="12.5" fill="#3B7C8A">card, later: problem, cause, fix,</text>
  <text x="826" y="316" font-size="12.5" fill="#3B7C8A">repositories, identifiers, error text</text>
  <path d="M778 215 H694" fill="none" stroke="#1D3B4D" stroke-width="3" marker-end="url(#memkinds-head-1d3b4d-11)"/>
  <text x="736" y="207" font-size="12" fill="#3A4440" text-anchor="middle">past cards</text>
  <!-- organizational memory (later) -->
  <rect x="780" y="430" width="430" height="200" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="995" y="462" font-size="20" fill="#1A1F1D" font-weight="700" text-anchor="middle">Organizational memory</text>
  <text x="995" y="482" font-size="12.5" fill="#3A4440" text-anchor="middle">true for every ticket</text>
  <text x="805" y="512" font-size="13" fill="#1A1F1D">an order reference has at most 20 characters</text>
  <text x="805" y="536" font-size="13" fill="#1A1F1D">test logs live in the staging index</text>
  <text x="805" y="560" font-size="13" fill="#1A1F1D">3 tests have failed on main since last week</text>
  <text x="805" y="584" font-size="13" fill="#1A1F1D">releases are cut from the main branch</text>
  <path d="M778 470 H735 V300 H694" fill="none" stroke="#1D3B4D" stroke-width="3" marker-end="url(#memkinds-head-1d3b4d-11)"/>
  <text x="742" y="392" font-size="12" fill="#3A4440">facts</text>
  <!-- memory keeper: writes the card, proposes facts, you approve -->
  <path d="M910 350 V370" fill="none" stroke="#1D3B4D" stroke-width="2.5" marker-end="url(#memkinds-head-1d3b4d-11)"/>
  <rect x="830" y="372" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#DF6A7C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="910" y="394" font-size="13.5" fill="#B6475A" text-anchor="middle">memory keeper</text>
  <text x="922" y="365" font-size="12" fill="#3A4440">writes the card, proposes facts</text>
  <path d="M990 389 H1028" fill="none" stroke="#C08326" stroke-width="2.5" marker-end="url(#memkinds-head-c08326-11)"/>
  <circle cx="1046" cy="380" r="8" fill="#C08326"/>
  <path d="M1033 404 Q1033 390 1046 390 Q1059 390 1059 404 Z" fill="#C08326"/>
  <text x="1076" y="394" font-size="12.5" fill="#1A1F1D">you approve</text>
  <path d="M1046 410 V428" fill="none" stroke="#C08326" stroke-width="2.5" marker-end="url(#memkinds-head-c08326-11)"/>
  <path d="M1046 418 H640 V436" fill="none" stroke="#C08326" stroke-width="2.5" marker-end="url(#memkinds-head-c08326-11)"/>
  <!-- personal memory (later) -->
  <rect x="360" y="440" width="340" height="160" fill="#FBF5EA" stroke="#C08326" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530" y="468" font-size="20" fill="#1A1F1D" font-weight="700" text-anchor="middle">Personal memory</text>
  <text x="530" y="488" font-size="12.5" fill="#3A4440" text-anchor="middle">goes with you to any company</text>
  <text x="380" y="516" font-size="13" fill="#1A1F1D">open with the answer, then the detail</text>
  <text x="380" y="540" font-size="13" fill="#1A1F1D">three or more items: a table</text>
  <text x="380" y="564" font-size="13" fill="#1A1F1D">no co-author lines in commits</text>
  <text x="380" y="588" font-size="13" fill="#8A5A12">company facts stay behind</text>
  <path d="M358 520 H236" fill="none" stroke="#C08326" stroke-width="2.5" marker-end="url(#memkinds-head-c08326-11)"/>
  <text x="297" y="510" font-size="12" fill="#3A4440" text-anchor="middle">as a message</text>
  <!-- legend -->
  <rect x="30" y="621" width="14" height="14" rx="2" fill="#DF6A7C"/>
  <text x="54" y="632.5" font-size="13" fill="#1A1F1D">a model</text>
  <rect x="125.85" y="621" width="14" height="14" rx="2" fill="#5C9CAB"/>
  <text x="149.85" y="632.5" font-size="13" fill="#1A1F1D">a program</text>
  <rect x="235.99" y="621" width="14" height="14" rx="2" fill="#C08326"/>
  <text x="259.99" y="632.5" font-size="13" fill="#1A1F1D">you</text>
  <rect x="304.75" y="622" width="17" height="12" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="328.75" y="632.5" font-size="13" fill="#1A1F1D">planned for later</text>
</svg>
