<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-label="How jig-agents runs a child. The agent calls subagent start with a role and a task. jig-agents in the parent starts a separate Pi in RPC mode, sends it the task over a pipe only the parent holds, and counts its turns, minutes and cost, stopping it at a limit. The child loads the same plugins, so jig-core governs its tools and jig-sandbox its bash; its role is scout, reviewer or worker, and its model comes from configuration. When the child's rules say ask, the question comes back over the pipe and is shown to you, labelled with the child's name, and your answer goes back. When the child finishes, its report reaches the parent agent as a message, without polling." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="439" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="agentsrpc-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="agentsrpc-head-c08326-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C08326"/></marker>
  </defs>
  <!-- the parent -->
  <text x="40" y="30" font-size="13" fill="#3A4440" font-weight="700">the parent Pi</text>
  <rect x="40" y="44" width="260" height="76" rx="6" fill="#5D4B7C"/>
  <text x="170.0" y="71.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the agent</text>
  <text x="170.0" y="88.0" font-size="12" fill="#FFFFFF" text-anchor="middle">subagent start: a role and a task,</text>
  <text x="170.0" y="105.0" font-size="12" fill="#FFFFFF" text-anchor="middle">then carries on</text>
  <path d="M170 120 V168" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#agentsrpc-head-1d3b4d-11)"/>
  <text x="180" y="149" font-size="12" fill="#3A4440">start</text>
  <rect x="40" y="170" width="260" height="110" rx="6" fill="#1D3B4D"/>
  <text x="170.0" y="197.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-agents</text>
  <text x="170.0" y="214.0" font-size="12" fill="#FFFFFF" text-anchor="middle">starts the child, holds its pipe,</text>
  <text x="170.0" y="231.0" font-size="12" fill="#FFFFFF" text-anchor="middle">counts turns, minutes and cost,</text>
  <text x="170.0" y="248.0" font-size="12" fill="#FFFFFF" text-anchor="middle">stops it at a limit</text>
  <!-- you -->
  <path d="M110 280 V338" fill="none" stroke="#C08326" stroke-width="2.4" marker-end="url(#agentsrpc-head-c08326-11)"/>
  <text x="100" y="314" font-size="12" fill="#3A4440" text-anchor="end">question</text>
  <path d="M230 338 V282" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#agentsrpc-head-1d3b4d-11)"/>
  <text x="240" y="314" font-size="12" fill="#3A4440">your answer</text>
  <rect x="40" y="340" width="260" height="76" rx="6" fill="#FBF1DD" stroke="#C08326" stroke-width="1.8"/>
  <text x="170.0" y="367.0" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">you</text>
  <text x="170.0" y="384.0" font-size="12" fill="#3A4440" text-anchor="middle">see each question, labelled with</text>
  <text x="170.0" y="401.0" font-size="12" fill="#3A4440" text-anchor="middle">the child's name; no screen means no</text>
  <!-- the pipe -->
  <path d="M300 205 H498" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#agentsrpc-head-1d3b4d-11)"/>
  <text x="400" y="196" font-size="12" fill="#3A4440" text-anchor="middle">the task, over the pipe</text>
  <path d="M500 250 H302" fill="none" stroke="#C08326" stroke-width="2.4" marker-end="url(#agentsrpc-head-c08326-11)"/>
  <text x="400" y="268" font-size="12" fill="#3A4440" text-anchor="middle">a question its rules ask</text>
  <!-- the child -->
  <rect x="500" y="150" width="440" height="200" rx="6" fill="#5C9CAB"/>
  <text x="720.0" y="180.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the child: a separate Pi, pi --mode rpc</text>
  <text x="720.0" y="204.0" font-size="12" fill="#FFFFFF" text-anchor="middle">the same plugins as the parent:</text>
  <text x="720.0" y="221.0" font-size="12" fill="#FFFFFF" text-anchor="middle">jig-core governs its tools, jig-sandbox its bash</text>
  <text x="720.0" y="248.0" font-size="12" fill="#FFFFFF" text-anchor="middle">its role: scout, reviewer or worker</text>
  <text x="720.0" y="265.0" font-size="12" fill="#FFFFFF" text-anchor="middle">its model: from configuration, never the agent file</text>
  <text x="720.0" y="292.0" font-size="12" fill="#FFFFFF" text-anchor="middle">a worker writes only in a worktree of its own</text>
  <!-- the report -->
  <path d="M720 150 V82 H302" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#agentsrpc-head-1d3b4d-11)"/>
  <text x="510" y="72" font-size="12" fill="#3A4440" text-anchor="middle">its report, as a message: no polling</text>
</svg>
