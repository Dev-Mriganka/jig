<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="492" viewBox="0 0 1000 492" role="img" aria-label="Jig's memory in five steps: write notes and evidence while working; consolidate at ticket close into a card and proposed facts that you approve; index the cards by shared keys; retrieve by keys, then keyword search; use the best cards as a short message. Bands below: protect every write, keep it small, and measure recall before adding embeddings or a graph." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="999" height="491" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <!-- the five steps -->
  <polygon points="20,40 192,40 210,72 192,104 20,104 36,72" fill="#1D3B4D"/>
  <text x="118" y="79" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 Write</text>
  <rect x="26" y="124" width="178" height="70" rx="4" fill="#DF6A7C"/>
  <text x="115" y="147.69" font-size="13" fill="#FFFFFF" text-anchor="middle">notes.md: status, next</text>
  <text x="115" y="163.55" font-size="13" fill="#FFFFFF" text-anchor="middle">step, open questions,</text>
  <text x="115" y="179.41" font-size="13" fill="#FFFFFF" text-anchor="middle">decisions</text>
  <rect x="26" y="204" width="178" height="70" rx="4" fill="#5C9CAB"/>
  <text x="115" y="235.62" font-size="13" fill="#FFFFFF" text-anchor="middle">evidence/: tool results,</text>
  <text x="115" y="251.48" font-size="13" fill="#FFFFFF" text-anchor="middle">masked, with an index</text>
  <polygon points="216,40 388,40 406,72 388,104 216,104 232,72" fill="#1D3B4D"/>
  <text x="314" y="79" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 Consolidate</text>
  <rect x="222" y="124" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#DF6A7C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="311" y="147.69" font-size="13" fill="#B6475A" text-anchor="middle">a memory keeper writes</text>
  <text x="311" y="163.55" font-size="13" fill="#B6475A" text-anchor="middle">the card and proposes</text>
  <text x="311" y="179.41" font-size="13" fill="#B6475A" text-anchor="middle">facts at close</text>
  <rect x="222" y="204" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#C08326" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="311" y="227.69" font-size="13" fill="#8A5A12" text-anchor="middle">you approve the exact</text>
  <text x="311" y="243.55" font-size="13" fill="#8A5A12" text-anchor="middle">text of every proposed</text>
  <text x="311" y="259.41" font-size="13" fill="#8A5A12" text-anchor="middle">fact</text>
  <polygon points="412,40 584,40 602,72 584,104 412,104 428,72" fill="#1D3B4D"/>
  <text x="510" y="79" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 Index</text>
  <rect x="418" y="124" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="507" y="147.69" font-size="13" fill="#3B7C8A" text-anchor="middle">keys on each card: links,</text>
  <text x="507" y="163.55" font-size="13" fill="#3B7C8A" text-anchor="middle">identifiers, classes, error</text>
  <text x="507" y="179.41" font-size="13" fill="#3B7C8A" text-anchor="middle">text</text>
  <rect x="418" y="204" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="507" y="235.62" font-size="13" fill="#3B7C8A" text-anchor="middle">plain files first: no</text>
  <text x="507" y="251.48" font-size="13" fill="#3B7C8A" text-anchor="middle">embeddings or graph yet</text>
  <polygon points="608,40 780,40 798,72 780,104 608,104 624,72" fill="#1D3B4D"/>
  <text x="706" y="79" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 Retrieve</text>
  <rect x="614" y="124" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="703" y="147.69" font-size="13" fill="#3B7C8A" text-anchor="middle">when a ticket starts:</text>
  <text x="703" y="163.55" font-size="13" fill="#3B7C8A" text-anchor="middle">match the shared keys</text>
  <text x="703" y="179.41" font-size="13" fill="#3B7C8A" text-anchor="middle">first</text>
  <rect x="614" y="204" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="703" y="235.62" font-size="13" fill="#3B7C8A" text-anchor="middle">then keyword search over</text>
  <text x="703" y="251.48" font-size="13" fill="#3B7C8A" text-anchor="middle">the cards</text>
  <polygon points="804,40 976,40 994,72 976,104 804,104 820,72" fill="#1D3B4D"/>
  <text x="902" y="79" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 Use</text>
  <rect x="810" y="124" width="178" height="70" rx="4" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="899" y="155.62" font-size="13" fill="#3B7C8A" text-anchor="middle">the best cards arrive as a</text>
  <text x="899" y="171.48" font-size="13" fill="#3B7C8A" text-anchor="middle">short message</text>
  <rect x="810" y="204" width="178" height="70" rx="4" fill="#5C9CAB"/>
  <text x="899" y="235.62" font-size="13" fill="#FFFFFF" text-anchor="middle">after a compaction, notes</text>
  <text x="899" y="251.48" font-size="13" fill="#FFFFFF" text-anchor="middle">come back as a message</text>
  <!-- bands that cross every step -->
  <rect x="20" y="292" width="960" height="44" fill="#1D3B4D"/>
  <text x="34" y="319" font-size="13" fill="#FFFFFF"><tspan font-weight="700">Protect every write: </tspan>evidence is masked like everything else · you approve the exact text of every proposed fact</text>
  <rect x="20" y="344" width="960" height="44" fill="#6B6B6B"/>
  <text x="34" y="371" font-size="13" fill="#FFFFFF"><tspan font-weight="700">Keep it small: </tspan>the Now block stays under 1 KB, old blocks move to history/ · only the best cards arrive</text>
  <rect x="20" y="396" width="960" height="44" fill="#4E7A58"/>
  <text x="34" y="423" font-size="13" fill="#FFFFFF"><tspan font-weight="700">Measure first: </tspan>a recall test built from real tickets · embeddings or a graph only if it shows misses</text>
  <!-- legend -->
  <rect x="20" y="459" width="14" height="14" rx="2" fill="#5C9CAB"/>
  <text x="44" y="470.5" font-size="13" fill="#1A1F1D">a program</text>
  <rect x="130.14" y="459" width="14" height="14" rx="2" fill="#DF6A7C"/>
  <text x="154.14" y="470.5" font-size="13" fill="#1A1F1D">a model</text>
  <rect x="225.99" y="459" width="14" height="14" rx="2" fill="#C08326"/>
  <text x="249.99" y="470.5" font-size="13" fill="#1A1F1D">you</text>
  <rect x="294.75" y="460" width="17" height="12" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="318.75" y="470.5" font-size="13" fill="#1A1F1D">planned for later</text>
</svg>
