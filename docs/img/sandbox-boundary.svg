<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-label="Where the sandbox line runs. On the host: the broker, which runs the sandbox runtime and wraps each command; Pi and Jig's tools, which work through jig-core's rules with your credentials; your own ! commands, never sandboxed; and the network, which is the machine's own in open mode and goes through the proxy in filtered and ask modes. Inside the sandbox: the agent's bash, foreground and background, and four kinds of path. Hidden paths cannot be read: ~/.ssh, ~/.aws, ~/.kube, a project's .env, Pi's auth.json, the same list jig-core protects. Locked paths are read but never written: ~/.bashrc, PATH folders, git hooks, Pi's settings, Gradle init scripts. Ask-first paths, the toolchain folders, are writable once you say yes. Everything else is writable as outside: the project, your home, /tmp, build caches." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="499" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="sandboxline-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="sandboxline-head-a93c27-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A93C27"/></marker>
  </defs>
  <!-- the host -->
  <rect x="20" y="20" width="360" height="460" rx="8" fill="#FFFFFF" stroke="#D2D9D3" stroke-width="1.4"/>
  <text x="36" y="44" font-size="13" fill="#3A4440" font-weight="700">on the host</text>
  <rect x="40" y="60" width="320" height="80" rx="6" fill="#5C9CAB"/>
  <text x="200.0" y="87.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the broker</text>
  <text x="200.0" y="104.0" font-size="12" fill="#FFFFFF" text-anchor="middle">runs the sandbox runtime,</text>
  <text x="200.0" y="121.0" font-size="12" fill="#FFFFFF" text-anchor="middle">one per session, outside Pi</text>
  <rect x="40" y="160" width="320" height="96" rx="6" fill="#1D3B4D"/>
  <text x="200.0" y="187.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pi and Jig's tools</text>
  <text x="200.0" y="204.0" font-size="12" fill="#FFFFFF" text-anchor="middle">git, jira, mongo, deploy: through</text>
  <text x="200.0" y="221.0" font-size="12" fill="#FFFFFF" text-anchor="middle">jig-core's rules, with your</text>
  <text x="200.0" y="238.0" font-size="12" fill="#FFFFFF" text-anchor="middle">credentials</text>
  <rect x="40" y="276" width="320" height="64" rx="6" fill="#5D4B7C"/>
  <text x="200.0" y="303.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">your own ! commands</text>
  <text x="200.0" y="320.0" font-size="12" fill="#FFFFFF" text-anchor="middle">never sandboxed: they are yours</text>
  <rect x="40" y="360" width="320" height="100" rx="6" fill="#8C979D"/>
  <text x="200.0" y="387.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the network</text>
  <text x="200.0" y="404.0" font-size="12" fill="#FFFFFF" text-anchor="middle">open: the machine's own</text>
  <text x="200.0" y="421.0" font-size="12" fill="#FFFFFF" text-anchor="middle">filtered, ask: through the proxy</text>
  <text x="200.0" y="438.0" font-size="12" fill="#FFFFFF" text-anchor="middle">off: none</text>
  <!-- the sandbox -->
  <rect x="420" y="20" width="540" height="460" rx="8" fill="#F1F6F7" stroke="#5C9CAB" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="436" y="44" font-size="13" fill="#3A4440" font-weight="700">inside the sandbox</text>
  <rect x="440" y="60" width="500" height="80" rx="6" fill="#5D4B7C"/>
  <text x="690.0" y="87.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the agent's bash</text>
  <text x="690.0" y="104.0" font-size="12" fill="#FFFFFF" text-anchor="middle">foreground commands and background tasks,</text>
  <text x="690.0" y="121.0" font-size="12" fill="#FFFFFF" text-anchor="middle">each wrapped by the broker before Pi starts it</text>
  <path d="M360 100 H438" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#sandboxline-head-1d3b4d-11)"/>
  <text x="399" y="92" font-size="12" fill="#3A4440" text-anchor="middle">wraps</text>
  <rect x="440" y="160" width="500" height="64" rx="6" fill="#F7E4DF" stroke="#A93C27" stroke-width="1.8"/>
  <text x="690.0" y="187.0" font-size="13" fill="#A93C27" font-weight="700" text-anchor="middle">hidden: cannot be read</text>
  <text x="690.0" y="204.0" font-size="12" fill="#3A4440" text-anchor="middle">~/.ssh, ~/.aws, ~/.kube, a project's .env, Pi's auth.json</text>
  <path d="M360 208 H400 V192 H438" fill="none" stroke="#A93C27" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#sandboxline-head-a93c27-11)"/>
  <text x="392" y="232" font-size="11" fill="#A93C27" text-anchor="middle">one list</text>
  <rect x="440" y="240" width="500" height="64" rx="6" fill="#FBF1DD" stroke="#C08326" stroke-width="1.8"/>
  <text x="690.0" y="267.0" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">locked: read, never written</text>
  <text x="690.0" y="284.0" font-size="12" fill="#3A4440" text-anchor="middle">~/.bashrc, PATH folders, git hooks, Pi's settings, Gradle init scripts</text>
  <rect x="440" y="320" width="500" height="64" rx="6" fill="#FFFFFF" stroke="#5C9CAB" stroke-width="1.8"/>
  <text x="690.0" y="347.0" font-size="13" fill="#2F6E7C" font-weight="700" text-anchor="middle">ask first: writable once you say yes</text>
  <text x="690.0" y="364.0" font-size="12" fill="#3A4440" text-anchor="middle">~/.sdkman, ~/.nvm, ~/.pyenv and the other toolchain folders</text>
  <rect x="440" y="400" width="500" height="64" rx="6" fill="#E6F0E9" stroke="#4E8A5E" stroke-width="1.8"/>
  <text x="690.0" y="427.0" font-size="13" fill="#3D6E4B" font-weight="700" text-anchor="middle">writable: as outside</text>
  <text x="690.0" y="444.0" font-size="12" fill="#3A4440" text-anchor="middle">the project, your home, /tmp, build caches</text>
</svg>
