<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Layers, bottom to top. Pi with its built-in tools: read, write, edit, bash, ls, find and grep. Above it jig-core, the tool manager: classify, rules and the floor, approvals, secrets, mask, redact, cap, record and the watch engine. Above that the twelve generic plugins, and the tools of any other Pi package, governed the same way. On top, the private company plugin with environments, sign-in, internal tools, backends and knowledge. Everything below the company plugin goes with you to any job." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
