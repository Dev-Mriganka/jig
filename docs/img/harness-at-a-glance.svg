  <text x="1036" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pi</text>
  <text x="1036" y="116" font-size="14" fill="#FFFFFF" text-anchor="middle">coding agent</text>
  <path d="M1052.45 180.5 A19 19 0 1 1 1025.1 174.44" fill="none" stroke="#E7B55B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1033.79,168.36 1028.87,181.56 1019.69,168.46" fill="#E7B55B"/>
  <text x="1036" y="234" font-size="15" fill="#FFFFFF" text-anchor="middle">initial</text>
  <text x="1036" y="254" font-size="15" fill="#FFFFFF" text-anchor="middle">generation</text>
  <text x="1036" y="318" font-size="12.5" fill="#E9E4F2" text-anchor="middle">with subagents:</text>
  <text x="1036" y="336" font-size="12.5" fill="#E9E4F2" text-anchor="middle">planner, reviewer,</text>
  <text x="1036" y="354" font-size="12.5" fill="#E9E4F2" text-anchor="middle">scout, worker</text>
  <path d="M1052.45 436.5 A19 19 0 1 1 1025.1 430.44" fill="none" stroke="#E7B55B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1033.79,424.36 1028.87,437.56 1019.69,424.46" fill="#E7B55B"/>
  <text x="1036" y="490" font-size="15" fill="#FFFFFF" text-anchor="middle">self-</text>
  <text x="1036" y="510" font-size="15" fill="#FFFFFF" text-anchor="middle">correcting</text>
  <text x="1036" y="538" font-size="12.5" fill="#E9E4F2" text-anchor="middle">every tool call</text>
  <text x="1036" y="554" font-size="12.5" fill="#E9E4F2" text-anchor="middle">passes jig-core</text>
  <!-- legend -->
  <polygon points="41,498 43,503 48,505 43,507 41,512 39,507 34,505 39,503" fill="#DF6A7C"/>
  <text x="57" y="509.5" font-size="13" fill="#1A1F1D">a model decides</text>
  <circle cx="41" cy="530" r="6" fill="#5C9CAB"/>
  <circle cx="41" cy="530" r="2.4" fill="#FFFFFF"/>
  <text x="57" y="534.5" font-size="13" fill="#1A1F1D">a program decides</text>
  <circle cx="41" cy="550" r="4.96" fill="#C08326"/>
  <path d="M32.94 564.88 Q32.94 556.2 41 556.2 Q49.06 556.2 49.06 564.88 Z" fill="#C08326"/>
