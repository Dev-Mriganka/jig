  <polygon points="220.41,236.29 216.6,246.89 209.14,236.24" fill="#FFFFFF"/>
  <polygon points="190,372 232,372 262,400 232,428 190,428" fill="#C08326"/>
  <path d="M229.53 394.5 A11 11 0 1 1 213.69 390.99" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="220.41,386.29 216.6,396.89 209.14,386.24" fill="#FFFFFF"/>
  <!-- the harness frame: guides above, sensors below -->
  <rect x="262" y="20" width="550" height="565" rx="4" fill="#E8ECEE" stroke="#1D3B4D" stroke-width="6"/>
  <rect x="282" y="40" width="510" height="252" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.5"/>
  <text x="776" y="276" font-size="21" fill="#1A1F1D" font-weight="700" text-anchor="end">Guides</text>
  <rect x="282" y="312" width="510" height="252" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.5"/>
  <text x="776" y="340" font-size="21" fill="#1A1F1D" font-weight="700" text-anchor="end">Sensors</text>
  <!-- guides -->
  <rect x="298" y="58" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="373" y="87.9" font-size="14" fill="#FFFFFF" text-anchor="middle">AGENTS.md</text>
  <polygon points="438,62 440,67 445,69 440,71 438,76 436,71 431,69 436,67" fill="#DF6A7C"/>
  <rect x="460" y="58" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="535" y="87.9" font-size="14" fill="#FFFFFF" text-anchor="middle">skills</text>
