<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="605" viewBox="0 0 1110 605" role="img" aria-label="The Jig harness at a glance. You steer by changing guides and sensors. Guides such as AGENTS.md, skills, rules, the approved plan and ticket notes feed forward into Pi before it acts. Sensors such as tests, CI checks, logs and reviews feed back after it acts, so Pi can correct itself." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
