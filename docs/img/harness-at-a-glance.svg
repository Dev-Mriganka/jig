  <text x="30" y="90" font-size="33" fill="#1A1F1D" font-weight="700">harness for</text>
  <text x="30" y="126" font-size="33" fill="#1A1F1D" font-weight="700">tickets</text>
  <!-- you steer -->
  <rect x="30" y="190" width="160" height="280" fill="#C08326"/>
  <text x="110" y="236" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">You</text>
