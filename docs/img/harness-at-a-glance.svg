  <path d="M430.5 497 Q430.5 490 437 490 Q443.5 490 443.5 497 Z" fill="#C08326"/>
  <rect x="460" y="480" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="535" y="509.9" font-size="14" fill="#1D3B4D" text-anchor="middle">check tiers</text>
  <circle cx="600" cy="491" r="6" fill="#5C9CAB"/>
  <circle cx="600" cy="491" r="2.4" fill="#FFFFFF"/>
  <rect x="622" y="480" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="697" y="509.9" font-size="14" fill="#1D3B4D" text-anchor="middle">checker agent</text>
