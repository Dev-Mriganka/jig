  <circle cx="762" cy="367" r="2.4" fill="#FFFFFF"/>
  <rect x="298" y="418" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="373" y="447.9" font-size="14" fill="#FFFFFF" text-anchor="middle">logs</text>
  <circle cx="438" cy="429" r="6" fill="#5C9CAB"/>
  <circle cx="438" cy="429" r="2.4" fill="#FFFFFF"/>
  <rect x="460" y="418" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="535" y="447.9" font-size="14" fill="#FFFFFF" text-anchor="middle">Mongo reads</text>
  <circle cx="600" cy="429" r="6" fill="#5C9CAB"/>
  <circle cx="600" cy="429" r="2.4" fill="#FFFFFF"/>
  <rect x="622" y="418" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="697" y="447.9" font-size="14" fill="#FFFFFF" text-anchor="middle">Copilot review</text>
  <polygon points="762,422 764,427 769,429 764,431 762,436 760,431 755,429 760,427" fill="#DF6A7C"/>
  <rect x="298" y="480" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="373" y="509.9" font-size="14" fill="#FFFFFF" text-anchor="middle">your code review</text>
