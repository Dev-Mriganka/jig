  <rect x="460" y="182" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="535" y="203.36" font-size="14" fill="#1D3B4D" text-anchor="middle">organizational</text>
  <text x="535" y="220.44" font-size="14" fill="#1D3B4D" text-anchor="middle">facts</text>
  <polygon points="600,186 602,191 607,193 602,195 600,200 598,195 593,193 598,191" fill="#DF6A7C"/>
  <rect x="622" y="182" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#1D3B4D" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="697" y="211.9" font-size="14" fill="#1D3B4D" text-anchor="middle">personal facts</text>
  <polygon points="762,186 764,191 769,193 764,195 762,200 760,195 755,193 760,191" fill="#DF6A7C"/>
  <!-- sensors -->
  <rect x="298" y="356" width="150" height="50" rx="4" fill="#1D3B4D"/>
  <text x="373" y="385.9" font-size="14" fill="#FFFFFF" text-anchor="middle">tests at HEAD</text>
