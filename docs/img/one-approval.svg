<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="404" viewBox="0 0 1100 404" role="img" aria-label="Two timelines of one ticket. Today, your approval is needed at every push, three times in this example, plus a confirmation for writes to staging. With one approval per change, pushes need only passing tests, the checker runs before the test environment, scenarios run there, and you approve once before the pull request goes to teammates, with all the evidence. Writes to staging are still confirmed." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
