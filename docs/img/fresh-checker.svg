<svg xmlns="http://www.w3.org/2000/svg" width="800" height="276" viewBox="0 0 800 276" role="img" aria-label="The maker hands a ready commit to a fresh-context checker that reads the approved plan, the diff, the check results, the rules and earlier review comments. A pass goes to your code review; a revise goes back to the maker with findings; after two rounds the decision comes to you with both reports." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="275" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="checker-head-1d64a8-10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D64A8"/></marker>
  </defs>
  <!-- what the checker reads -->
  <rect x="280" y="12" width="270" height="52" rx="6" fill="#E3EDF7" stroke="#1D64A8" stroke-width="1.6"/>
  <text x="415" y="33" font-size="12.5" fill="#18201C" text-anchor="middle">approved plan · diff · check results</text>
  <text x="415" y="51" font-size="12.5" fill="#18201C" text-anchor="middle">rules and earlier review comments</text>
  <path d="M415 64 V100" fill="none" stroke="#1D64A8" stroke-width="1.8" marker-end="url(#checker-head-1d64a8-10)"/>
  <!-- maker, checker, your review -->
  <rect x="30" y="102" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#18201C" stroke-width="1.2"/>
  <text x="115" y="128" font-size="15" fill="#18201C" font-weight="700" text-anchor="middle">maker</text>
  <text x="115" y="148" font-size="12.5" fill="#56635D" text-anchor="middle">main agent or worker</text>
  <rect x="320" y="102" width="190" height="60" rx="6" fill="#E3EDF7" stroke="#1D64A8" stroke-width="1.6"/>
  <text x="415" y="128" font-size="15" fill="#18201C" font-weight="700" text-anchor="middle">checker</text>
  <text x="415" y="148" font-size="12.5" fill="#56635D" text-anchor="middle">fresh context, read-only</text>
  <rect x="610" y="102" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#18201C" stroke-width="1.2"/>
  <text x="690" y="128" font-size="15" fill="#18201C" font-weight="700" text-anchor="middle">code review</text>
  <text x="690" y="148" font-size="12.5" fill="#56635D" text-anchor="middle">you, in the browser</text>
  <path d="M200 132 H318" fill="none" stroke="#1D64A8" stroke-width="1.8" marker-end="url(#checker-head-1d64a8-10)"/>
  <text x="259" y="124" font-size="12.5" fill="#56635D" text-anchor="middle">commit ready</text>
  <path d="M510 132 H608" fill="none" stroke="#1D64A8" stroke-width="1.8" marker-end="url(#checker-head-1d64a8-10)"/>
  <text x="559" y="124" font-size="12.5" fill="#56635D" text-anchor="middle">pass</text>
  <!-- revise: back to the maker -->
  <path d="M415 162 V216 H115 V164" fill="none" stroke="#1D64A8" stroke-width="1.8" marker-end="url(#checker-head-1d64a8-10)"/>
  <text x="265" y="240" font-size="12.5" fill="#1D64A8" font-weight="700" text-anchor="middle">revise: findings with file and line</text>
  <!-- after round 2: you decide -->
  <path d="M510 152 H564 V234 H608" fill="none" stroke="#1D64A8" stroke-width="1.8" marker-end="url(#checker-head-1d64a8-10)"/>
  <text x="574" y="196" font-size="12.5" fill="#56635D">after round 2</text>
  <rect x="610" y="208" width="160" height="54" rx="6" fill="#FFFFFF" stroke="#18201C" stroke-width="1.2"/>
  <text x="690" y="232" font-size="15" fill="#18201C" font-weight="700" text-anchor="middle">you decide</text>
  <text x="690" y="250" font-size="12.5" fill="#56635D" text-anchor="middle">both reports attached</text>
</svg>
