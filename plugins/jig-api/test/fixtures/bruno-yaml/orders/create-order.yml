info:
  name: Create order
  type: http
  seq: 3
http:
  method: POST
  url: "{{baseUrl}}/{{apiVersion}}/orders"
  headers:
    - name: Idempotency-Key
      value: "{{$guid}}"
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}",
        "sku": "{{sku}}",
        "quantity": {{quantity}},
        "createdAt": "{{$isoTimestamp}}"
      }
  auth: inherit
settings:
  encodeUrl: true
