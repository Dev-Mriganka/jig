info:
  name: Browser sign-in
  type: http
  seq: 5
http:
  method: GET
  url: "{{baseUrl}}/stock"
  auth:
    type: oauth2
    flow: authorization_code
    accessTokenUrl: "{{authUrl}}/oauth/token"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
    scope: stock.read
    tokenConfig:
      placement:
        header: Bearer
settings:
  encodeUrl: true
