info:
  name: Password stock
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/stock"
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: "{{authUrl}}/oauth/token"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    resourceOwner:
      username: "{{serviceUser}}"
      password: "{{servicePassword}}"
    scope: stock.read
    tokenConfig:
      placement:
        header: Bearer
settings:
  encodeUrl: true
