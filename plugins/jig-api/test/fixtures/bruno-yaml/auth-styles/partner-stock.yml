info:
  name: Partner stock
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/stock"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{authUrl}}/oauth/token"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: stock.read
    tokenConfig:
      placement:
        header: Bearer
settings:
  encodeUrl: true
